<script src="chart.umd.js"></script>
<script>

const ctx = document.getElementById('myChart');

let pie3 = {
    datasets: [{
        data: [100],
        rotation: 0,
        backgroundColor: [
          'rgb(255, 200, 0)',
          'rgb(100, 200, 100)',
          'rgb(255, 100, 100)'
        ],
        hoverOffset: 100
    }],
    labels: [
        'Planning',
    ],
        links: [
        'datavalue3',
    ],
}

let pie2 = {
    datasets: [{
        data: [100],
        rotation: 0,
        backgroundColor: [
          'rgb(255, 200, 0)',
          'rgb(100, 200, 100)',
          'rgb(255, 100, 100)'
        ],
        hoverOffset: 100
    }],
    labels: [
        'Planning',
    ],
        links: [
        'text',
    ],
}

let pie1 = {
    datasets: [{
        data: [10,20,10,60],
        rotation: 0,
        backgroundColor: [
          'rgb(255, 200, 0)',
          'rgb(100, 200, 100)',
          'rgb(255, 100, 100)'
        ],
        hoverOffset: 100
    }],
    labels: [
        'MANAGEMENT',
        'COMMUNICATION',
        'ROUTINE',
        'ACTION',
    ],
    links: [
        pie2,
        'COMMUNICATION',
        'ROUTINE',
        'ACTION',
    ],
}



new Chart(ctx, {
    type: 'pie',
    data: pie1,

    options: {
        plugins: {
            legend: {
                display: false,
            }
        },
        layout: {
            padding: 50
        },
        // Event handler for a click on a chart element
        onClick: function (event, elements, chart) {
    
            const clickedElement = elements[0];
    
            const datasetIndex = clickedElement.index;
    
            const label = chart.data.labels[datasetIndex];
    
            const labelValue = chart.data.datasets[0].data[datasetIndex];
            
            const linkValue = chart.data.links[datasetIndex];
    
            // Show an alert with information about the clicked segment
             alert(`Clicked on: ${label} and it\'s value is ${labelValue}`);
            // window.open('https://www.unitedgames.co.uk','_blank');
            //alert(`Clicked on: ${label} and it\'s value is ${labelValue} with a link of ${linkValue}.`);
            this.data = chart.data.links[datasetIndex];

            this.update();
        }
        
    }
});
</script>
