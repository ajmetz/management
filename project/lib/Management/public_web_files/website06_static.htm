<script src="chart.umd.js"></script>
<script>

const ctx = document.getElementById('myChart');


class PieData {
    constructor(labelled_data) {
        this.datasets = [
            {
                data: [labelled_data.values],
                rotation: 0,
                backgroundColor:    [
                                      'rgb(255, 200, 0)',
                                      'rgb(100, 200, 100)',
                                      'rgb(255, 100, 100)'
                                    ],
                hoverOffset: 100,
            }
        ];
        this.labels         =   [labelled_data.keys];
        this.links          =   [];
    }
    set_links(links_array) {
        this.links  =   links_array;
    }
    get_data() {
        return this.datasets.data;
    } 
}

let pie_e = new PieData ({
    'Category E':5,
    'Category F':5,
})

console.log(pie_e.get_data());
 

let pie_d = new PieData ({
        'Category D':20,
        'Category E':30,
})



let pie_c = new PieData ({
        'Category D':50,
        'Category E':10,
})



let pie_a = new PieData ({
        'Category B':10,
})



let pie_action = new PieData ({
        'Category C':60,
})




let pie_routine = new PieData ({
        'Category A':10,
})



let pie_communication = new PieData ({
        'Email':20,
})



let pie_management = new PieData ({
        'Planning':10,
})


let pie_top = new PieData ({
        'MANAGEMENT':10,
        'COMMUNICATION':20,
        'ROUTINE':10,
        'ACTION':60,
})

pie_e.set_links([
    pie_d,
])

pie_d.set_links([
    pie_c,
    pie_e,
])

pie_c.set_links([
    pie_d,
    pie_e,
])

pie_a.set_links([
    pie_routine,
])

pie_action.set_links([
    pie_c,
])

pie_routine.set_links([
    pie_a,
])


pie_communication.set_links([
    pie_top,
])


pie_management.set_links([
    pie_top,
])


pie_top.set_links([
    pie_management,
    pie_communication,
    pie_routine,
    pie_action,
])


new Chart(ctx, {
    type: 'pie',
    data: pie_top,

    options: {
        plugins: {
            legend: {
                display: false,
            }
        },
        layout: {
            padding: 50
        },
        // Event handler for a click on a chart element
        onClick: function (event, elements, chart) {
    
            const clickedElement = elements[0];
    
            const datasetIndex = clickedElement.index;
    
            const label = chart.data.labels[datasetIndex];
    
            const labelValue = chart.data.datasets[0].data[datasetIndex];
            
            const linkValue = chart.data.links[datasetIndex];
    
            // Show an alert with information about the clicked segment
             alert(`Clicked on: ${label} and it\'s value is ${labelValue}`);
            // window.open('https://www.unitedgames.co.uk','_blank');
            //alert(`Clicked on: ${label} and it\'s value is ${labelValue} with a link of ${linkValue}.`);
            this.data = chart.data.links[datasetIndex];

            this.update();
        }
        
    }
});
</script>
